<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root{--p:#00855d;--pd:#006948;--s:#006398;--bg:#faf8ff;--card:#fff;
      --soft:#eef5f1;--text:#131b2e;--muted:#65736b;--line:#dce5df;
      --shadow:0 12px 34px rgba(19,27,46,.12)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans KR",sans-serif;
      background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}
    #app{width:100%;height:100vh;overflow-x:hidden;overflow-y:auto;padding:66px 0 112px;overscroll-behavior-y:contain}.top{position:fixed;inset:0 0 auto;z-index:50;
      height:66px;padding:9px 14px;display:flex;align-items:center;gap:10px;background:rgba(250,248,255,.94);
      backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .logo{width:44px;height:44px;padding:7px;border-radius:15px;background:linear-gradient(145deg,#13b882,var(--p))}
    .logo svg{width:100%;height:100%}.logo path,.logo circle{fill:none;stroke:#fff;stroke-width:4;
      stroke-linecap:round;stroke-linejoin:round}.logo .leaf{fill:#cdf6e1;stroke:none}
    .brand{display:flex;flex-direction:column}.brand strong{color:var(--pd);font-size:18px}.brand small{color:var(--muted)}
    .status{margin-left:auto;padding:7px 10px;border-radius:999px;background:#d9f8e9;color:var(--pd);
      font-size:12px;font-weight:800}.page{display:none;width:100%;max-width:none;margin:0;padding:0 12px 28px}.page.active{display:block}
    .theme-toggle{flex:0 0 40px;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;
      background:var(--card);color:var(--text);font-size:19px;line-height:1;display:grid;place-items:center}
    .theme-toggle:hover,.theme-toggle:focus-visible{box-shadow:0 0 0 2px var(--p);outline:none}
    .hero,.card,.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
    .hero{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:12px}.hero i{font-style:normal;font-size:26px}
    .hero h1{font-size:19px;margin:0}.hero p{font-size:13px;color:var(--muted);margin:3px 0 0}
    .search{padding:13px;margin-bottom:10px}.field{display:grid;grid-template-columns:36px 1fr;align-items:center;gap:8px;margin:7px 0}
    .field b{width:11px;height:11px;border-radius:50%;background:var(--p);justify-self:center}.field.dest b{background:var(--s)}
    .coordinates{display:none;grid-template-columns:1fr 1fr;gap:7px;margin:7px 0}.coordinates.on{display:grid}
    input,select{width:100%;border:0;border-radius:14px;padding:12px;background:var(--soft);color:var(--text);outline:none}
    input:focus,select:focus{box-shadow:0 0 0 2px var(--p)}.modes{display:flex;gap:7px;overflow:auto;padding:6px 0}
    .chip{white-space:nowrap;border:0;border-radius:999px;padding:9px 12px;background:var(--soft);color:var(--text)}
    .chip.on{background:var(--s);color:#fff}.primary,.secondary,.danger{width:100%;border:0;border-radius:999px;
      min-height:48px;padding:10px 15px;font-weight:800}.primary{background:var(--pd);color:#fff}
    .secondary{background:var(--soft);color:var(--text)}.danger{background:#ffdad6;color:#93000a}
    .map{height:47vh;min-height:350px;border-radius:20px;overflow:hidden;background:#e8eee9;border:1px solid var(--line)}
    .map iframe{width:100%;height:100%;border:0}.sheet{padding:12px;margin-top:-15px;position:relative;z-index:3}
    .handle{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 10px}
    .sheet-head{display:flex;justify-content:space-between;align-items:flex-start}.badge{display:inline-block;padding:5px 8px;
      border-radius:99px;background:#d9f8e9;color:var(--pd);font-size:11px;font-weight:800}.score{text-align:right}
    .score strong{color:var(--pd);font-size:25px}.routes,.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .route,.stat{padding:12px;border-radius:16px;background:var(--soft)}.route.best{background:linear-gradient(145deg,var(--p),var(--pd));color:#fff}
    .route strong,.stat strong{display:block;font-size:23px;margin-top:5px}.route p,.stat p{font-size:12px;margin:3px 0;color:inherit;opacity:.8}
    .engine{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:9px;padding-top:9px;font-size:12px}
    .bike{margin-top:10px;padding:13px;border-radius:17px;background:#e5f3ff;color:#004b73}.bike strong{display:block}
    .notice{margin:9px 0;padding:11px;border-radius:14px;background:#fff4d9;color:#624c00;font-size:13px}
    .notice.error{background:#ffdad6;color:#93000a}.guide{padding:15px;margin-bottom:10px}.guide .live{color:var(--p);font-weight:800}
    .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.metric{padding:11px;border-radius:15px;background:var(--soft)}
    .metric small{display:block;color:var(--muted)}.metric strong{font-size:20px}.actions{display:flex;gap:8px}.actions button{flex:1}
    .filters{display:flex;gap:6px;overflow:auto;margin:8px 0}.restaurant{padding:13px;margin:9px 0}.restaurant h3{margin:0 0 4px;font-size:16px}
    .restaurant p{color:var(--muted);font-size:12px}.restaurant a{color:var(--s);font-weight:700;text-decoration:none}
    .wallet{padding:16px;background:linear-gradient(145deg,var(--s),#004b73);color:#fff}.wallet strong{display:block;font-size:25px}
    .form-row{display:flex;gap:8px;margin:9px 0}.form-row>*{flex:1}.check{display:flex;align-items:center;gap:8px;font-size:13px;margin:10px 0}
    .check input{width:auto}.leader{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line)}
    .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.report-grid .stat{min-height:105px}
    .report-grid .stat:first-child{background:linear-gradient(145deg,var(--p),var(--pd));color:#fff}
    .coach{margin-top:12px;padding:14px}.coach-head{display:flex;align-items:center;gap:8px}.chat{max-height:310px;overflow:auto;margin:10px 0}
    .bubble{max-width:88%;padding:11px 13px;border-radius:15px;margin:8px 0;background:var(--soft);font-size:13px;line-height:1.62;word-break:keep-all;overflow-wrap:anywhere}
    .bubble.user{margin-left:auto;background:var(--pd);color:#fff}.chat-form{display:grid;grid-template-columns:1fr 48px;gap:7px}
    .bubble p{margin:0 0 8px}.bubble p:last-child{margin-bottom:0}.bubble ul{margin:5px 0 7px;padding-left:19px}
    .bubble li{margin:3px 0}.bubble strong{color:var(--pd);font-weight:850}.bubble.user strong{color:inherit}
    .toast-stack{position:fixed;z-index:80;right:12px;top:74px;display:flex;flex-direction:column;gap:7px;max-width:340px}
    .toast{padding:11px 35px 11px 12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);position:relative;font-size:13px}
    .toast button{position:absolute;right:7px;top:7px;border:0;background:none;color:var(--text)}
    nav{position:fixed;z-index:70;inset:auto 0 0;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
      display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(16px)}
    nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;padding:5px}
    nav button span{font-size:22px}nav button.on{color:var(--pd);font-weight:800}nav button.on span{transform:translateY(-2px)}
    .empty{text-align:center;color:var(--muted);padding:28px}.small{font-size:11px;color:var(--muted)}
    html.light{--p:#00855d;--pd:#006948;--s:#006398;--bg:#faf8ff;--card:#fff;--soft:#eef5f1;
      --text:#131b2e;--muted:#65736b;--line:#dce5df;--shadow:0 12px 34px rgba(19,27,46,.12)}
    html.dark{--bg:#101713;--card:#17211b;--soft:#243229;--text:#edf7f0;--muted:#aebcb3;--line:#35463b;--pd:#69dcaa}
    html.light .top,html.light nav{background:rgba(250,248,255,.96)}
    html.dark .top,html.dark nav{background:rgba(16,23,19,.96)}html.dark .status,html.dark .badge{background:#244c3b;color:#9df1c9}
    @media(min-width:800px){.page{padding-left:22px;padding-right:22px}.map{height:60vh}.top{padding-left:22px;padding-right:22px}
      nav{padding-left:22px;padding-right:22px}}
    @media(prefers-color-scheme:dark){html:not(.light){--bg:#101713;--card:#17211b;--soft:#243229;--text:#edf7f0;--muted:#aebcb3;--line:#35463b;--pd:#69dcaa;--pv:#69dcaa}
      html:not(.light) .top,html:not(.light) nav{background:rgba(16,23,19,.96)}html:not(.light) .status,html:not(.light) .badge{background:#244c3b;color:#9df1c9}}
  </style>
</head>
<body><div id="app"></div>
<script>
let payload={}, activePage="map", selectedMode="여름", eventCounter=0, pendingEventId=null, streamlitTheme="light";
let themePreference="system";try{themePreference=localStorage.getItem("pihaga-theme")||"system"}catch(_error){}
const shownToastKeys=new Set();
const pages={map:["🗺️","지도"],navigation:["🧭","안내"],nearby:["🍽️","주변"],trip:["✅","이동"],report:["📊","리포트"]};
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
function richText(value){const safe=esc(value);const blocks=safe.split(/\n\s*\n/).filter(Boolean);return blocks.map(block=>{const lines=block.split('\n');if(lines.every(line=>/^\s*[-*]\s+/.test(line)))return `<ul>${lines.map(line=>`<li>${line.replace(/^\s*[-*]\s+/, '').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}</li>`).join('')}</ul>`;return `<p>${block.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</p>`}).join('')}
function applyTheme(base=streamlitTheme){streamlitTheme=base||"light";const systemDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;const dark=themePreference==="dark"||(themePreference==="system"&&(streamlitTheme==="dark"||systemDark));document.documentElement.classList.toggle("dark",dark);document.documentElement.classList.toggle("light",!dark)}
function toggleTheme(){const dark=document.documentElement.classList.contains("dark");themePreference=dark?"light":"dark";try{localStorage.setItem("pihaga-theme",themePreference)}catch(_error){}applyTheme();render()}
function send(action,data={}){const id=`${Date.now()}-${++eventCounter}`;pendingEventId=id;window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value:{id,action,page:activePage,...data}},"*")}
function mapFrame(){return `<div class="map"><iframe id="active-map-frame" title="피해가 지도" sandbox="allow-scripts allow-same-origin allow-popups"><p>지도를 불러오는 중입니다.</p></iframe></div>`}
function routeSheet(){const r=payload.route;if(!r)return `<div class="sheet empty">출발지와 도착지를 입력해 경로를 검색하세요.</div>`;
 return `<section class="sheet"><div class="handle"></div><div class="sheet-head"><div><span class="badge">${esc(r.mode)} 맞춤 추천</span><h3>맞춤 경로와 일반 경로 비교</h3></div><div class="score"><small>쾌적 점수</small><br><strong>${r.optimized.comfort}</strong>점</div></div><div class="routes"><div class="route best"><small>추천 · ${esc(r.mode)}</small><strong>${r.optimized.duration}분</strong><p>${r.optimized.distance}km · 쾌적 ${r.optimized.comfort}점</p></div><div class="route"><small>일반 최단</small><strong>${r.baseline.duration}분</strong><p>${r.baseline.distance}km · 쾌적 ${r.baseline.comfort}점</p></div></div><div class="engine"><span>경로 생성 엔진</span><b>${esc(r.method)}</b></div>${r.explanation?`<div class="notice">${esc(r.explanation)}</div>`:''}</section>`}
function mapPage(){const bike=payload.bike;return `<section class="page active" data-page="map"><div class="card search"><div class="field"><b></b><input id="origin" value="${esc(payload.inputs?.origin||'서울역')}" placeholder="출발지"></div><div class="field dest"><b></b><input id="destination" value="${esc(payload.inputs?.destination||'광화문')}" placeholder="도착지"></div><label class="check"><input id="direct" type="checkbox" onchange="document.getElementById('coordinates').classList.toggle('on',this.checked)">주소 대신 좌표 직접 입력</label><div class="coordinates" id="coordinates"><input id="origin-lat" type="number" step="any" value="37.5547" aria-label="출발지 위도"><input id="origin-lng" type="number" step="any" value="126.9707" aria-label="출발지 경도"><input id="destination-lat" type="number" step="any" value="37.5759" aria-label="도착지 위도"><input id="destination-lng" type="number" step="any" value="126.9768" aria-label="도착지 경도"></div><div class="modes">${['여름','가을','겨울','안심'].map(m=>`<button class="chip ${selectedMode===m?'on':''}" onclick="selectedMode='${m}';render()">${m}</button>`).join('')}</div><button class="primary" onclick="searchRoute()">경로 검색</button></div>${mapFrame()}${routeSheet()}${bike?`<div class="bike"><strong>🚲 따릉이 복합 이동</strong><span>${esc(bike.reason)}</span>${bike.recommended?`<p>${esc(bike.pickup)} → ${esc(bike.dropoff)} · 약 ${bike.duration}분</p>`:''}</div>`:''}</section>`}
function navigationPage(){const r=payload.route,n=payload.navigation;if(!r)return emptyPage('navigation','지도에서 경로를 먼저 검색해 주세요.');return `<section class="page active" data-page="navigation"><div class="hero"><i>🧭</i><div><h1>실시간 경로 안내</h1><p>현재 위치 버튼을 사용하거나 안내 지도에서 위치를 직접 선택하세요.</p></div></div><div class="card guide"><div class="live">● ${n?.active?'안내 중':'안내 준비 완료'}</div><h2>${esc(n?.instruction||`${r.mode} 맞춤 경로를 선택할 수 있습니다.`)}</h2>${n?.active?`<div class="metrics"><div class="metric"><small>다음 행동까지</small><strong>${n.action_distance}m</strong></div><div class="metric"><small>남은 거리</small><strong>${n.remaining}m</strong></div></div>`:''}<div class="form-row"><select id="nav-kind"><option value="optimized">${esc(r.mode)} 맞춤 경로</option><option value="baseline">일반 최단 경로</option></select></div><div class="actions">${n?.active?`<button class="danger" onclick="send('stop_navigation')">안내 종료</button><button class="secondary" onclick="locate()">현재 위치 갱신</button>`:`<button class="primary" onclick="send('start_navigation',{route_kind:document.getElementById('nav-kind').value})">안내 시작</button>`}</div></div>${mapFrame()}${routeSheet()}${payload.audio?`<audio autoplay src="data:audio/wav;base64,${payload.audio}"></audio>`:''}</section>`}
function nearbyPage(){const rs=payload.restaurants||[];return `<section class="page active" data-page="nearby"><div class="hero"><i>🍽️</i><div><h1>도보 동선 맞춤 스팟</h1><p>맞춤 경로에 고르게 분포한 음식점을 찾습니다.</p></div></div><div class="filters"><button class="chip on">전체</button><button class="chip">카페·음료</button><button class="chip">음식점</button></div><button class="primary" ${payload.route?'':'disabled'} onclick="send('search_restaurants')">맞춤 경로 주변 맛집 찾기</button>${rs.length?rs.map(x=>`<article class="card restaurant"><span class="badge">${esc(x.provider)}</span><h3>${esc(x.name)}</h3><p>${esc(x.address)}${x.rating?` · 평점 ${x.rating}`:''}${x.reviews?` · 리뷰 ${x.reviews}개`:''}</p>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">지도에서 보기 ↗</a>`:''}</article>`).join(''):`<div class="empty">${payload.route?'버튼을 눌러 경로 주변 맛집을 찾아보세요.':'지도에서 경로를 먼저 검색해 주세요.'}</div>`}</section>`}
function tripPage(){const r=payload.route,t=payload.trip||{},leaders=payload.leaderboard||[];return `<section class="page active" data-page="trip"><div class="hero"><i>✅</i><div><h1>이동 기록</h1><p>완료한 걷기를 로컬 원장과 포인트에 반영합니다.</p></div></div><div class="card wallet"><small>나의 로컬 포인트</small><strong>${t.points||0} P</strong><span>${r?`${r.optimized.distance}km · ${r.mode} 맞춤 경로`:'경로 검색 전'}</span></div>${!t.attendance_claimed?`<button class="secondary" onclick="send('claim_attendance')">오늘 출석체크 · 50 P 받기</button>`:''}${r?`<div class="card search"><select id="trip-kind"><option value="optimized">${esc(r.mode)} 맞춤 경로</option><option value="baseline">일반 최단 경로</option></select><label class="check"><input id="taxi" type="checkbox">택시 대신 이 경로를 걸었습니다.</label><button class="primary" ${t.recorded?'disabled':''} onclick="send('complete_trip',{route_kind:document.getElementById('trip-kind').value,taxi_replaced:document.getElementById('taxi').checked})">${t.recorded?'기록 완료':'이동 완료하고 포인트 받기'}</button></div>`:`<div class="empty">지도에서 경로를 먼저 검색해 주세요.</div>`}<div class="card">${leaders.map(x=>`<div class="leader"><span>${x.rank}. ${esc(x.name)}</span><b>${x.points} P</b></div>`).join('')}</div></section>`}
function reportPage(){const m=payload.report||{},history=m.history||[];return `<section class="page active" data-page="report"><div class="hero"><i>📊</i><div><h1>월간 이동 리포트</h1><p>걷기와 환경 기여를 월별로 확인하세요.</p></div></div><select onchange="send('select_report_month',{month:this.value})">${(m.months||[m.month]).map(x=>`<option ${x===m.month?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="report-grid"><article class="stat"><small>걸은 거리</small><strong>${m.distance||0}</strong> km<p>전월 대비 ${m.distance_delta||0}km</p></article><article class="stat"><small>완료 이동</small><strong>${m.trips||0}</strong>건</article><article class="stat"><small>탄소 절감</small><strong>${m.carbon||0}</strong> kgCO₂e</article><article class="stat"><small>비용 절감</small><strong>${m.savings||0}</strong>원</article></div><section class="card coach"><div class="coach-head"><span>✨</span><div><b>피해가! AI 이동 코치</b><div class="small">계산된 월간 통계를 바탕으로 답합니다.</div></div></div><div class="chat">${history.length?history.map(x=>`<div class="bubble ${x.role==='user'?'user':''}">${x.role==='user'?esc(x.content):richText(x.content)}</div>`).join(''):`<div class="bubble">${richText(m.briefing||'월간 이동 기록을 분석할 준비가 됐어요.')}</div>`}</div><div class="chat-form"><input id="chat-question" placeholder="지난달과 무엇이 달라졌나요?"><button class="primary" onclick="askCoach()">➤</button></div></section></section>`}
function emptyPage(name,text){return `<section class="page active" data-page="${name}"><div class="empty">${esc(text)}</div></section>`}
function nav(){return `<nav>${Object.entries(pages).map(([key,v])=>`<button class="${activePage===key?'on':''}" onclick="activePage='${key}';render()"><span>${v[0]}</span>${v[1]}</button>`).join('')}</nav>`}
function toastStack(){const items=[];if(payload.notice){const key=`notice:${payload.notice.id||payload.notice.text}`;if(!shownToastKeys.has(key)){shownToastKeys.add(key);items.push(payload.notice)}}if(payload.show_coupons){const batch=payload.coupon_event_id||'coupon';(payload.restaurants||[]).forEach((r,i)=>{const key=`${batch}:${i}`;if(!shownToastKeys.has(key)){shownToastKeys.add(key);items.push({type:'success',text:`맛집 혜택 후보 · ${r.name}\n현재는 제휴 전 MVP 안내입니다.`})}})}return items.length?`<div class="toast-stack">${items.map(x=>`<div class="toast ${x.type==='error'?'error':''}">${esc(x.text).replace(/\n/g,'<br>')}<button onclick="this.parentElement.remove()">×</button></div>`).join('')}</div>`:''}
function render(){const content=activePage==='map'?mapPage():activePage==='navigation'?navigationPage():activePage==='nearby'?nearbyPage():activePage==='trip'?tripPage():reportPage();const dark=document.documentElement.classList.contains('dark');document.getElementById('app').innerHTML=`<header class="top"><div class="logo"><svg viewBox="0 0 48 48"><path d="M11 35C17 28 18 20 27 17C33 15 36 12 39 7"/><circle cx="39" cy="7" r="5"/><path class="leaf" d="M9 38c1-8 5-12 12-13c-1 8-5 12-12 13Z"/></svg></div><div class="brand"><strong>피해가!(街)</strong><small>서울 맞춤 보행 경로</small></div><button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="${dark?'화이트 모드':'다크 모드'}로 전환" title="${dark?'화이트 모드':'다크 모드'}로 전환">${dark?'☀️':'🌙'}</button><span class="status">${pages[activePage][1]}</span></header>${toastStack()}${content}${nav()}`;const frame=document.getElementById('active-map-frame');if(frame)frame.srcdoc=activePage==='navigation'?(payload.navigation_map_html||payload.map_html||''):(payload.map_html||'');setTimeout(resize,20)}
function searchRoute(){const direct=document.getElementById('direct').checked;send('search_route',{origin:document.getElementById('origin').value,destination:document.getElementById('destination').value,mode:selectedMode,direct_coordinates:direct,origin_latitude:document.getElementById('origin-lat').value,origin_longitude:document.getElementById('origin-lng').value,destination_latitude:document.getElementById('destination-lat').value,destination_longitude:document.getElementById('destination-lng').value})}
function askCoach(){const q=document.getElementById('chat-question').value.trim();if(q)send('chat',{question:q})}
function locate(){if(!navigator.geolocation)return send('location_error');navigator.geolocation.getCurrentPosition(p=>send('update_location',{latitude:p.coords.latitude,longitude:p.coords.longitude}),()=>send('location_error'))}
function resize(){let h=window.screen.availHeight||860;try{h=window.parent.innerHeight||h}catch(_error){}h=Math.max(800,h);document.documentElement.style.height=h+'px';window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}
window.addEventListener('message',e=>{if(e.data?.type==='pihaga-map-click')return send('update_location',{latitude:e.data.latitude,longitude:e.data.longitude});if(e.data?.type==='streamlit:render'){const nextPayload=e.data.args.payload||{};if(pendingEventId&&nextPayload.ack_event_id!==pendingEventId)return;pendingEventId=null;payload=nextPayload;if(payload.active_page&&pages[payload.active_page])activePage=payload.active_page;selectedMode=payload.inputs?.mode||selectedMode;applyTheme(e.data.theme?.base||streamlitTheme);render()}});
window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
resize();
  </script>
